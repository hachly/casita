# The Contributor Licence Agreement check (CLA.md). Each pull request author signs once, by
# commenting the sentence below on a pull request; each signature is committed to
# signatures/cla.json on the cla-signatures branch (make that branch once, from main, when the
# repository goes public). It runs only while the repository is public.
#
# pull_request_target runs this file as it is on the default branch, with a token that may write;
# no step checks out or runs the pull request's code.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    if: >-
      github.event.repository.private == false && (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read CLA.md and I sign it.')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot],github-actions[bot]
          custom-pr-sign-comment: I have read CLA.md and I sign it.
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before we can merge it, each author of its commits signs our
            [Contributor Licence Agreement](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md) once:
            you keep the copyright in your work and give Hachly Limited a licence to use and relicense it.
            To sign, comment on this pull request with exactly the sentence below.
          custom-allsigned-prcomment: Every author of this pull request has signed the Contributor Licence Agreement.
          signed-commit-message: "$contributorName signed the Contributor Licence Agreement in #$pullRequestNo"
          create-file-commit-message: The Contributor Licence Agreement's signatures
          lock-pullrequest-aftermerge: true
